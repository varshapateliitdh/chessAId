[tool.poetry]
name = "chessAId"
version = "0.1.0"
description = "AI chess guide."
authors = []
license = "MIT"
readme = "README.md"
repository = "https://github.com/ccurme/chessAId"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
ipython = "^8.8.0"
chess = ">=1.0,<2.0"
langchain = ">=0.0.350,<1.0"
langchain-openai = "^0.0.8"
openai = ">=1.3.7,<2"
langserve = {version = ">=0.0.37,<1.0", extras = ["all"]}
websockets = ">=12.0,<13.0"
typing-extensions = "^4.9.0"
azure-ai-ml = "^1.14.0"                         # Optional: if you need ML workspace access
azure-core = "^1.29.5"                          # Azure SDK base
azure-identity = "^1.15.0"                      # For managed identity / credentials
python-dotenv = "^1.0.1"                        # Optional: to load secrets from .env
httpx = ">=0.24.0,<0.25.0"
uvicorn = "^0.34.2"
aiohttp = "!=3.11.17"

[tool.poetry.group.test.dependencies]
pytest = "^7.2.0"
pytest-cov = "^4.0.0"

[tool.poetry.group.lint.dependencies]
black = "^22.10.0"
isort = "^5.10.1"
flake8 = "^6.0.0"

[tool.poetry.group.typing.dependencies]
mypy = "^0.991"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"

[tool.isort]
profile = "black"
src_paths = ["chessAId"]

[tool.mypy]
ignore_missing_imports = "True"
disallow_untyped_defs = "True"
exclude = ["tests"]
